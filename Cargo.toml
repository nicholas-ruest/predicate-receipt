[package]
name = "predicate-receipt"
version = "0.1.0"
edition = "2024"
description = "Deterministic JSON policy checks with tamper-evident admission receipts"
license = "MIT"
repository = "https://github.com/nicholas-ruest/predicate-receipt"
keywords = ["json", "policy", "validation", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
regex = "1.11.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true
